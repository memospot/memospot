# App command permissions.
#
# Declaring any app permission creates an app ACL manifest, which gates every
# app command (see docs/adr/paste-image-app-acl.md). Each command below maps
# to one `allow-<command>` entry referenced from a capability file. The
# paste-image read stays Linux-only (see capabilities/paste-image.toml);
# every other command is re-allowed for local pages in
# capabilities/default.toml.

[[permission]]
identifier = "allow-get-memos-url"
description = "Enables the get_memos_url command."
commands.allow = ["get_memos_url"]

[[permission]]
identifier = "allow-get-theme"
description = "Enables the get_theme command."
commands.allow = ["get_theme"]

