name: Check (formatting)

on:
  merge_group:
  pull_request:
    paths:
      - "**/check-formatting.yml"
      - "**/*.{css,html,md}"
      - "**/*.{rs,svelte,ts}"
      - "**/*.{json,jsonc,toml,yml,yaml}"
      - "!**/gen/schemas/*.json"
  push:
    paths:
      - "**/check-formatting.yml"
      - "**/*.{css,html,md}"
      - "**/*.{rs,svelte,ts}"
      - "**/*.{json,jsonc,toml,yml,yaml}"
      - "!**/gen/schemas/*.json"
    tags-ignore: ["*"]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  DPRINT_CACHE_DIR: ${{github.workspace}}/.dprint

jobs:
  dprint:
    name: Check formatting with dprint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Ensure LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rustfmt
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dprint
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8
        with:
          repo: dprint/dprint
          tag: 0.52.0
          cache: enable

      - name: Cache dprint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DPRINT_CACHE_DIR }}
          key: cache-dprint-${{ hashFiles('**/.dprint.jsonc','.dprint/plugin-cache-manifest.json') }}

      - run: dprint check
