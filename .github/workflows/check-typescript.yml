name: Check (TypeScript)

on:
  merge_group:
  pull_request:
    paths:
      - "**/check-typescript.yml"
      - "**/bun.lock"
      - "**/bunfig.toml"
      - "**/biome.jsonc"
      - "**/*.svelte"
      - "**/*.ts"
  push:
    paths:
      - "**/check-typescript.yml"
      - "**/bun.lock"
      - "**/bunfig.toml"
      - "**/biome.jsonc"
      - "**/*.svelte"
      - "**/*.ts"
    tags-ignore: ["*"]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  biome:
    name: TypeScript lint
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1

      - name: Lint code with Biome
        run: biome ci --css-parse-tailwind-directives=true .

  test:
    name: TypeScript tests
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
          - runner: macos-15
          - runner: windows-2022

    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies with Bun
        shell: bash
        run: |
          pushd ./build-scripts; bun install; popd
          pushd ./src-ui; bun install; popd

      - name: Run Bun tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          pushd ./build-scripts; bun test; popd
          pushd ./src-ui; bun test; popd
