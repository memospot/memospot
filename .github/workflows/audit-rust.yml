name: Audit (RustSec)

on:
  merge_group:
  pull_request:
    paths:
      - "**/audit-rust.yml"
      - "**/Cargo.lock"
  push:
    paths:
      - "**/audit-rust.yml"
      - "**/Cargo.lock"
    tags-ignore: ["*"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  audit-rust:
    name: Audit with RustSec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install cargo-audit"
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff
        with:
          tool: "cargo-audit@0.22.2"

      # Unmaintained upstream dependencies:
      #   - fxhash
      #   - unic-char-range
      #   - unic-common
      #   - unic-char-property
      #   - unic-ucd-version
      #   - unic-ucd-ident
      - name: Run cargo audit (SARIF)
        shell: bash
        run: |
          cargo audit \
            --format sarif \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2025-0100 | tee audit-rust.sarif
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload to code-scanning
        if: always()
        # Fork PRs lack security-events; keep the audit verdict authoritative.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: audit-rust.sarif
          category: cargo-audit
          wait-for-processing: true
