name: Audit (RustSec)

on:
  merge_group:
  pull_request:
    paths:
      - "**/audit-rust.yml"
      - "**/Cargo.lock"
  push:
    paths:
      - "**/audit-rust.yml"
      - "**/Cargo.lock"
    tags-ignore: ["*"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  audit-rust:
    name: Audit with RustSec
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install cargo-audit"
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff
        with:
          tool: "cargo-audit@0.22.1"

      - name: Rust audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          # Unmaintained:
          #   - fxhash
          #   - unic-char-range
          #   - unic-common
          #   - unic-char-property
          #   -	unic-ucd-version
          #   - unic-ucd-ident
          ignore: >-
            RUSTSEC-2025-0057,
            RUSTSEC-2025-0075,
            RUSTSEC-2025-0080,
            RUSTSEC-2025-0081,
            RUSTSEC-2025-0098,
            RUSTSEC-2025-0100
